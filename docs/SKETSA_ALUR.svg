<text x="375" y="250" class="title">→</text><text x="775" y="250" class="title">→</text><text x="373" y="455" class="title">←</text><text x="773" y="455" class="title">←</text>
<text x="40" y="605" class="body">Maju: action Home → List; pilih baris → Detail dengan laporan_id bertipe Long.</text>
